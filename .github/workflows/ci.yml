name: ci
on:
  pull_request:
  push:
    branches: [main]

# docs/TESTING_STRATEGY.md §CI. Todo corre sin claves salvo `evals`, que se saltea con aviso
# si el secret GEMINI_API_KEY no está (nunca rompe el build por falta de key).
# Token de solo lectura (informe pre-beta, Importante 12): cada job pide lo que necesita.
permissions:
  contents: read

# Un push nuevo a un PR cancela la corrida anterior del mismo PR (ahorra minutos de Actions).
# En main no se cancela: cada merge termina su corrida.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Escáner de secretos (gitleaks) sobre toda la historia: falla si encuentra algo. Lección del
  # 2026-09-11 (docs/AUDITORIA_2026-09-11.md): nunca publicar sin pasar esto antes.
  secrets:
    runs-on: ubuntu-latest
    # gitleaks lista los commits del PR por la API
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint && pnpm typecheck
      # Script del check `carril` (.github/scripts/carril.mjs), sin dependencias
      - run: node --test .github/scripts/carril.test.mjs

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate && pnpm test:integration

  build:
    # next build sin base ni claves: las páginas son dinámicas; el chequeo del rol corre en runtime
    runs-on: ubuntu-latest
    env:
      SKIP_APP_ROLE_CHECK: "1"
      AUTH_SECRET: ci-build-only-not-a-secret
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @job-search-os/web build

  evals:
    # Solo en PRs que tocan prompts o el harness. Subset (16 llamadas) con la versión vigente
    # de evaluate_job (DEFAULT_PROMPT_VERSIONS), ~USD 0,16 por corrida, con tope de costo;
    # sin GEMINI_API_KEY se saltea con aviso, no falla.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # La key solo entra en el paso que corre los evals: el resto del job (checkout, install, que corre
    # scripts de dependencias) no la ve. HAS_GEMINI_KEY dice si existe sin exponer el valor.
    env:
      HAS_GEMINI_KEY: ${{ secrets.GEMINI_API_KEY != '' }}
      EVALS_PROMPT: vigente
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, persist-credentials: false }
      - id: changed
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if git diff --name-only "origin/$BASE_REF...HEAD" | grep -Eq '^(packages/prompts|evals)/'; then
            echo run=true >> "$GITHUB_OUTPUT"
          else
            echo "::notice::evals: sin cambios en packages/prompts ni evals, no se corre"
          fi
      - if: steps.changed.outputs.run == 'true' && env.HAS_GEMINI_KEY != 'true'
        run: echo "::warning title=evals salteados::GEMINI_API_KEY no está configurada como secret del repo; los evals no corrieron. Configurala en Settings › Secrets para que el PR mida el prompt."
      - if: steps.changed.outputs.run == 'true' && env.HAS_GEMINI_KEY == 'true'
        uses: pnpm/action-setup@v4
      - if: steps.changed.outputs.run == 'true' && env.HAS_GEMINI_KEY == 'true'
        uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - if: steps.changed.outputs.run == 'true' && env.HAS_GEMINI_KEY == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.changed.outputs.run == 'true' && env.HAS_GEMINI_KEY == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: pnpm evals run --prompt "$EVALS_PROMPT" --subset --runs 1 --concurrency 1 --db none --yes --max-usd 0.5 --max-minutes 20

  e2e:
    # Playwright: los 4 flujos de docs/TESTING_STRATEGY.md contra Postgres + worker en modo demo (sin LLM)
    # Es el job más pesado: solo en PRs hacia main. En push a main no se repite (ya corrió en el PR)
    # y los PRs entre ramas de trabajo no lo disparan. Un job salteado por `if` cuenta como verde.
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CI: "1"
      DB_TARGET: local
      DATABASE_URL_LOCAL: postgres://postgres:postgres@localhost:5432/postgres
      DATABASE_URL_APP_LOCAL: postgres://jobsearch_app:jobsearch_app@localhost:5432/postgres
      AUTH_SECRET: ci-e2e-only-not-a-secret
      MCP_TOKEN: ci-e2e-only-not-a-secret
      SEED_USER_EMAIL: mauro@job-search-os.local
      SEED_USER_PASSWORD: dev-password-local
      E2E_EMAIL: mauro@job-search-os.local
      E2E_PASSWORD: dev-password-local
      # Usuario seed ficticio como admin de invitaciones: corren los casos "admin" del 38k (#92)
      # y del 39b (#97). Los casos "no admin" usan cuentas nuevas o se saltean. No es un secreto.
      ADMIN_EMAILS: mauro@job-search-os.local
      LLM_DAILY_CAP_USD: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate:local && pnpm db:seed:local
      - run: pnpm --filter @job-search-os/web exec playwright install --with-deps chromium
      - run: pnpm --filter @job-search-os/web build
      - run: pnpm --filter @job-search-os/web e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: apps/web/test-results/
          retention-days: 7
