name: ci
on:
  pull_request:
  push:
    branches: [main]
  # Para correr los evals pagos a mano: el job `evals` solo arranca si se lanza desde main
  workflow_dispatch:

# docs/TESTING_STRATEGY.md §CI. Todo corre sin claves salvo `evals`, que corre solo en push a main o a mano
# desde main (nunca en un pull_request: un PR no ve el secreto) y se saltea con aviso si el secret
# ANTHROPIC_API_KEY (proveedor principal) no está (nunca rompe el build por falta de key).
# Sin permisos por defecto: cada job pide solo lo que necesita.
permissions: {}

# Un push nuevo a un PR cancela la corrida anterior del mismo PR (ahorra minutos de Actions).
# En main no se cancela: cada merge termina su corrida.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Escáner de secretos (gitleaks) sobre toda la historia: falla si encuentra algo. Lección del
  # 2026-09-11 (docs/AUDITORIA_2026-09-11.md): nunca publicar sin pasar esto antes.
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # gitleaks lista los commits del PR por la API
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Dependencias de producción: falla con una vulnerabilidad alta o crítica
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@v4
      # Sin cache de pnpm: este job no instala, y con un lockfile nuevo el guardado del cache falla por falta de store
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: pnpm audit --prod --audit-level high

  lint-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint && pnpm typecheck
      # Scripts de .github (check `carril` y reglas de los workflows), sin dependencias
      - run: node --test .github/scripts/carril.test.mjs .github/scripts/workflows.test.mjs

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate && pnpm test:integration

  build:
    # next build sin base ni claves: las páginas son dinámicas; el chequeo del rol corre en runtime
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      SKIP_APP_ROLE_CHECK: "1"
      AUTH_SECRET: ci-build-only-not-a-secret
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @job-search-os/web build

  evals:
    # Solo después del merge (push a main) o a mano desde main, nunca en un pull_request: así el secreto no
    # llega a código de un PR. Corre si el push toca prompts o el harness; a mano corre siempre. Subset (16
    # llamadas) con la versión vigente de evaluate_job (DEFAULT_PROMPT_VERSIONS), ~USD 0,16 por corrida,
    # con tope de costo; sin ANTHROPIC_API_KEY (el principal de evaluate_job) se saltea con aviso, no falla.
    # GEMINI_API_KEY es opcional: solo se pasa si existe, para el respaldo.
    # `environment: evals` queda para que las reglas del entorno (solo rama main) lo respalden.
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: evals
    permissions:
      contents: read
    # La key solo entra en el paso que corre los evals: el resto del job (checkout, install, que corre
    # scripts de dependencias) no la ve. HAS_ANTHROPIC_KEY y HAS_GEMINI_KEY dicen si existen sin exponer el valor.
    env:
      HAS_ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
      HAS_GEMINI_KEY: ${{ secrets.GEMINI_API_KEY != '' }}
      EVALS_PROMPT: vigente
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, persist-credentials: false }
      - id: changed
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          # A mano o sin commit anterior conocido: se corre. En un push, solo si cambió prompts o evals.
          if [ "$EVENT" = "workflow_dispatch" ] || [ -z "$BEFORE" ] || [ -z "${BEFORE//0/}" ]; then
            echo run=true >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BEFORE" HEAD | grep -Eq '^(packages/prompts|evals)/'; then
            echo run=true >> "$GITHUB_OUTPUT"
          else
            echo "::notice::evals: sin cambios en packages/prompts ni evals, no se corre"
          fi
      - if: steps.changed.outputs.run == 'true' && env.HAS_ANTHROPIC_KEY != 'true'
        run: echo "::warning title=evals salteados::ANTHROPIC_API_KEY no está configurada como secret del entorno evals; los evals no corrieron. Configurala en Settings › Environments › evals para que se mida el prompt."
      - if: steps.changed.outputs.run == 'true' && env.HAS_ANTHROPIC_KEY == 'true'
        uses: pnpm/action-setup@v4
      - if: steps.changed.outputs.run == 'true' && env.HAS_ANTHROPIC_KEY == 'true'
        uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - if: steps.changed.outputs.run == 'true' && env.HAS_ANTHROPIC_KEY == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.changed.outputs.run == 'true' && env.HAS_ANTHROPIC_KEY == 'true'
        # GEMINI_API_KEY va vacía si el secret no existe: el proveedor sin clave queda no disponible
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ env.HAS_GEMINI_KEY == 'true' && secrets.GEMINI_API_KEY || '' }}
        run: pnpm evals run --prompt "$EVALS_PROMPT" --subset --runs 1 --concurrency 1 --db none --yes --max-usd 0.5 --max-minutes 20

  e2e-shard:
    # Playwright: los 4 flujos de docs/TESTING_STRATEGY.md contra Postgres + worker en modo demo (sin LLM)
    # Es el job más pesado: solo en PRs hacia main. En push a main no se repite (ya corrió en el PR)
    # y los PRs entre ramas de trabajo no lo disparan. Un job salteado por `if` cuenta como verde.
    # Partido en 4 máquinas (por archivo de spec, fullyParallel: false): cada una con su Postgres y su seed,
    # así ningún spec ve datos de otro. Bajó de ~60 a ~15-20 minutos. El job `e2e` de abajo junta el resultado.
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    name: e2e (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    permissions:
      contents: read
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CI: "1"
      DB_TARGET: local
      DATABASE_URL_LOCAL: postgres://postgres:postgres@localhost:5432/postgres
      DATABASE_URL_APP_LOCAL: postgres://jobsearch_app:jobsearch_app@localhost:5432/postgres
      AUTH_SECRET: ci-e2e-only-not-a-secret
      MCP_TOKEN: ci-e2e-only-not-a-secret
      SEED_USER_EMAIL: mauro@job-search-os.local
      SEED_USER_PASSWORD: dev-password-local
      E2E_EMAIL: mauro@job-search-os.local
      E2E_PASSWORD: dev-password-local
      # Usuario seed ficticio como admin de invitaciones: corren los casos "admin" del 38k (#92)
      # y del 39b (#97). Los casos "no admin" usan cuentas nuevas o se saltean. No es un secreto.
      ADMIN_EMAILS: mauro@job-search-os.local
      LLM_DAILY_CAP_USD: "0"
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate:local && pnpm db:seed:local
      - run: pnpm --filter @job-search-os/web exec playwright install --with-deps chromium
      - run: pnpm --filter @job-search-os/web build
      # CAPTURAS=1: el flujo 116 guarda capturas de las pantallas clave (C9-17, rediseño)
      - run: pnpm --filter @job-search-os/web e2e --shard=${{ matrix.shard }}/4
        env:
          CAPTURAS: "1"
      # El guard local no deja bajar artefactos: el contexto de cada falla (árbol de la página y error) va al log
      - if: failure()
        name: Contexto de los e2e que fallaron
        run: |
          find apps/web/test-results -name error-context.md -not -path "*retry*" | sort | while read -r f; do
            echo "::group::$f"
            head -c 12000 "$f"
            echo "::endgroup::"
          done
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-${{ matrix.shard }}
          path: apps/web/test-results/
          retention-days: 7
      # Capturas del rediseño (390 y 1280 px, claro y oscuro, datos inventados): artefacto, nunca al repo
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-${{ matrix.shard }}
          path: apps/web/test-results/capturas/
          if-no-files-found: ignore
          retention-days: 14
      # Comparaciones «referencia | real» de C10 (e2e 120, datos de Lucía, ficticios): artefacto, nunca al repo
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comparaciones-${{ matrix.shard }}
          path: apps/web/e2e/__comparaciones__/
          if-no-files-found: ignore
          retention-days: 14

  e2e:
    # Junta las 4 partes con el mismo nombre de siempre («e2e»), así la protección de la rama y los avisos no
    # cambian. Verde si las 4 pasaron o si se saltearon (push a main, PRs entre ramas de trabajo).
    if: always()
    needs: e2e-shard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - env:
          RESULT: ${{ needs.e2e-shard.result }}
        run: |
          echo "e2e (4 partes): $RESULT"
          [ "$RESULT" = "success" ] || [ "$RESULT" = "skipped" ]
