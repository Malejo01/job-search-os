version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Las versiones mayores rompen el CI (TypeScript 7, acciones por tag): se suben a mano en una tanda.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      produccion:
        dependency-type: production
      desarrollo:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Las versiones mayores rompen el CI (TypeScript 7, acciones por tag): se suben a mano en una tanda.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      acciones:
        patterns: ["*"]
