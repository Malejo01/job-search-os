packages:
  - "apps/*"
  - "packages/*"
  - "evals"

# pnpm 11: scripts postinstall bloqueados salvo lista explícita
allowBuilds:
  "@tailwindcss/oxide": true
  esbuild: true
  sharp: true
  unrs-resolver: true
  # deps nativas opcionales de testcontainers (ssh2): no hacen falta
  cpu-features: false
  protobufjs: false
  ssh2: false

minimumReleaseAgeExclude:
  - "@types/node@22.20.2"
  - "@ai-sdk/anthropic@4.0.52"
  - "@ai-sdk/gateway@4.0.78"
  - "@ai-sdk/google@4.0.67"
  - "@ai-sdk/provider-utils@5.0.39"
  - "@ai-sdk/provider@4.0.13"
  - ai@7.0.97
  - zod@4.6.1

# Versiones mínimas de dependencias transitivas (endurecimiento S2, 18/11)
overrides:
  "undici@>=7.0.0 <7.30.1": ">=7.30.1 <8"
  "postcss@<8.5.23": "^8.5.23"
  "source-map-js@<1.2.2": "^1.2.2"
  "sharp@<0.35.5": "^0.35.5"
  "zod@<4.6.6": "^4.6.6"
  # Solo desarrollo (testcontainers, vitest, drizzle-kit). Endurecimiento S5.
  "undici@>=8.0.0 <8.12.2": ">=8.12.2 <9"
  "@grpc/grpc-js@>=1.14.0 <1.14.5": "^1.14.5"
  "brace-expansion@>=2.0.0 <2.1.7": "^2.1.7"
  "brace-expansion@>=4.0.0 <5.0.12": "^5.0.12"
  "vite@>=8.2.0 <8.2.4": "^8.2.4"
  "@vitest/mocker@<4.1.12": "^4.1.12"
  "esbuild@<0.25.0": "^0.25.0"
